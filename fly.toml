# Fly.io — ChemCompass PYQ API
# https://fly.io/docs/languages-and-frameworks/docker/
app = "chemcompass-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  PYQ_CORPUS_DB = "/app/data/pyq-corpus/corpus.sqlite"
  PYQ_LLM_PROVIDER = "gemini"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
